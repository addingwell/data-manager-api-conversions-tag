<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .card { fill: #f5f5fb; stroke: #d9d9f2; stroke-width: 1.5; }
      .cardInner { fill: #ffffff; stroke: #1e21c8; stroke-width: 1.5; }
      .cardMain { fill: #1e21c8; }
      .title { fill: #0f1014; font-size: 16px; font-weight: 700; }
      .titleSmall { fill: #0f1014; font-size: 14px; font-weight: 700; }
      .titleLight { fill: #ffffff; font-size: 16px; font-weight: 700; }
      .desc { fill: #4a4a55; font-size: 12px; }
      .descLight { fill: #d9d9f2; font-size: 12px; }
      .code { fill: #1e21c8; font-size: 12px; font-family: SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #1e21c8; font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; }
      .arrow { fill: none; stroke: #1e21c8; stroke-width: 2.5; }
      .arrowSoft { fill: none; stroke: #1e21c8; stroke-width: 2; stroke-dasharray: 6 5; }
      .arrowHead { fill: #1e21c8; }
      .db { fill: #f5f5fb; stroke: #1e21c8; stroke-width: 1.5; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowHead"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="470" rx="16" fill="#ffffff"/>

  <!-- Sources -->
  <text x="145" y="52" text-anchor="middle" class="label">YOUR SYSTEMS</text>
  <g>
    <rect x="40" y="66" width="210" height="124" rx="12" class="card"/>
    <text x="145" y="104" text-anchor="middle" class="title">Website</text>
    <text x="145" y="130" text-anchor="middle" class="desc">GA4 hits: ad click landings,</text>
    <text x="145" y="148" text-anchor="middle" class="desc">leads, logins, purchases</text>
    <text x="145" y="172" text-anchor="middle" class="desc">(gclid, gbraid, fbclid, email…)</text>
  </g>
  <g>
    <rect x="40" y="272" width="210" height="150" rx="12" class="card"/>
    <text x="145" y="312" text-anchor="middle" class="title">CRM · POS · Server</text>
    <text x="145" y="340" text-anchor="middle" class="desc">Online &amp; offline</text>
    <text x="145" y="358" text-anchor="middle" class="desc">conversion events</text>
    <text x="145" y="386" text-anchor="middle" class="desc">Measurement Protocol</text>
    <text x="145" y="404" text-anchor="middle" class="desc">(GA4) format</text>
  </g>

  <!-- GTM Server -->
  <text x="510" y="52" text-anchor="middle" class="label">GTM SERVER</text>
  <rect x="362" y="66" width="296" height="370" rx="12" class="card"/>

  <g>
    <rect x="386" y="88" width="248" height="70" rx="10" class="cardInner"/>
    <text x="510" y="116" text-anchor="middle" class="titleSmall">Firestore Visitor Context</text>
    <text x="510" y="134" text-anchor="middle" class="titleSmall">Writer tag</text>
    <text x="510" y="151" text-anchor="middle" class="desc">stores the visitor's clicks &amp; identity</text>
  </g>

  <g>
    <rect x="386" y="214" width="248" height="70" rx="10" class="cardInner"/>
    <text x="510" y="242" text-anchor="middle" class="titleSmall">Firestore Visitor Context</text>
    <text x="510" y="260" text-anchor="middle" class="titleSmall">Reader variable</text>
    <text x="510" y="277" text-anchor="middle" class="desc">Augment event transformation</text>
  </g>

  <line x1="510" y1="284" x2="510" y2="330" class="arrow" marker-end="url(#ah)"/>
  <text x="522" y="312" class="code">aw_visitor_context</text>

  <g>
    <rect x="386" y="334" width="248" height="82" rx="10" class="cardMain"/>
    <text x="510" y="362" text-anchor="middle" class="titleLight">Data Manager API</text>
    <text x="510" y="382" text-anchor="middle" class="titleLight">Conversions tag</text>
    <text x="510" y="403" text-anchor="middle" class="descLight">hashing · consent · field mapping</text>
  </g>

  <!-- Website -> Writer -->
  <line x1="250" y1="124" x2="380" y2="123" class="arrow" marker-end="url(#ah)"/>
  <text x="315" y="112" text-anchor="middle" class="desc">GA4 hits</text>

  <!-- CRM -> Data Manager tag -->
  <path d="M 250 360 C 310 360, 320 375, 380 375" class="arrow" marker-end="url(#ah)"/>
  <text x="315" y="346" text-anchor="middle" class="desc">HTTP POST</text>

  <!-- Firestore -->
  <text x="790" y="132" text-anchor="middle" class="label">FIRESTORE</text>
  <g>
    <path d="M 730 156 L 730 226 A 60 14 0 0 0 850 226 L 850 156" class="db"/>
    <ellipse cx="790" cy="156" rx="60" ry="14" class="db"/>
    <text x="790" y="195" text-anchor="middle" class="code">aw_visitor_context</text>
    <text x="790" y="213" text-anchor="middle" class="desc">one doc per visitor</text>
  </g>

  <!-- Writer -> Firestore, Firestore -> Reader -->
  <path d="M 634 123 C 690 123, 700 150, 724 168" class="arrow" marker-end="url(#ah)"/>
  <text x="690" y="112" text-anchor="middle" class="desc">write</text>
  <path d="M 724 222 C 700 240, 690 249, 640 249" class="arrowSoft" marker-end="url(#ah)"/>
  <text x="700" y="268" text-anchor="middle" class="desc">read, once per event</text>

  <!-- Destinations -->
  <text x="1010" y="292" text-anchor="middle" class="label">DESTINATIONS</text>
  <path d="M 634 360 C 760 360, 780 334, 874 334" class="arrow" marker-end="url(#ah)"/>
  <path d="M 634 392 C 760 392, 780 412, 874 412" class="arrow" marker-end="url(#ah)"/>
  <text x="760" y="380" text-anchor="middle" class="desc">1 API call</text>
  <g>
    <rect x="880" y="302" width="260" height="62" rx="12" class="card"/>
    <text x="1010" y="330" text-anchor="middle" class="title">Google Ads</text>
    <text x="1010" y="350" text-anchor="middle" class="desc">Conversion action</text>
  </g>
  <g>
    <rect x="880" y="382" width="260" height="62" rx="12" class="card"/>
    <text x="1010" y="410" text-anchor="middle" class="title">Google Analytics 4</text>
    <text x="1010" y="430" text-anchor="middle" class="desc">GA4 property</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
